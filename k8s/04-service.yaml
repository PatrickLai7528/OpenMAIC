apiVersion: v1
kind: Service
metadata:
  name: openmaic
  namespace: open-maic
  labels:
    app.kubernetes.io/name: openmaic
spec:
  # MetalLB assigns a LAN IP (same pattern as other school services).
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: openmaic
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
