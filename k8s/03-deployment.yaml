apiVersion: apps/v1
kind: Deployment
metadata:
  name: openmaic
  namespace: ky-super-openamic
  labels:
    app.kubernetes.io/name: openmaic
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: openmaic
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openmaic
    spec:
      # Uncomment after creating the pull secret (see README):
      # imagePullSecrets:
      #   - name: registry-cred
      containers:
        - name: openmaic
          # Placeholder; overridden at apply time:
          #   IMAGE=ghcr.io/you/openmaic:tag ./apply.sh
          # or: kubectl -n ky-super-openamic set image deployment/openmaic openmaic=$IMAGE
          image: openmaic:agent-runtime
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: openmaic-config
            - secretRef:
                name: openmaic-secrets
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
      # Ensure pods can reach the Postgres host in DATABASE_URL (cluster egress / firewall).
      restartPolicy: Always
