apiVersion: apps/v1
kind: Deployment
metadata:
  name: openmaic
  namespace: open-maic
  labels:
    app.kubernetes.io/name: openmaic
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: openmaic
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openmaic
    spec:
      # nextjs runs as uid 1001 / gid 65533 (nogroup); fsGroup makes the
      # mounted data volume group-writable so the server can create /app/data.
      securityContext:
        fsGroup: 65533
      imagePullSecrets:
        - name: registry-cred
      containers:
        - name: openmaic
          # Placeholder; overridden at apply time by apply.sh (IMAGE=...).
          image: openmaic:agent-runtime
          imagePullPolicy: IfNotPresent
          # 上游 identity 層（lib/server/identity/*）已內建 cookie 處理；
          # 純 HTTP 由 configmap 的 COOKIE_SECURE=0 關閉 Secure，
          # 不再需要開機改寫 .next/server 的 cookie 補丁。
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: openmaic-config
            - secretRef:
                name: openmaic-secrets
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
      # Ensure pods can reach the Postgres host in DATABASE_URL (cluster egress / firewall).
      restartPolicy: Always
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openmaic-data
