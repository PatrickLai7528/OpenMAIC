# Non-secret runtime flags for Agent Runtime / Workbench backend
apiVersion: v1
kind: ConfigMap
metadata:
  name: openmaic-config
  namespace: open-maic
  labels:
    app.kubernetes.io/name: openmaic
data:
  HOSTNAME: "0.0.0.0"
  PORT: "3000"
  NODE_ENV: "production"
  # MetalLB / plain HTTP: browsers drop Secure cookies on http://, causing session 404s
  ANONYMOUS_COOKIE_SECURE: "0"

  OPENMAIC_AGENT_RUNTIME_ENABLED: "true"
  # Per-pod concurrent agent runs; 2 replicas × 4 ≈ 8 simultaneous long runs
  OPENMAIC_AGENT_RUNTIME_MAX_CONCURRENT: "4"

  # Volcengine Ark via the OpenAI-compatible slot (OPENAI_BASE_URL / OPENAI_MODELS)
  MODEL_ROUTES: '{"maic-agent-driver":{"model":"openai:doubao-seed-2-1-pro-260628","api":"openai-completions"}}'
  DEFAULT_MODEL: "openai:doubao-seed-2-1-pro-260628"
